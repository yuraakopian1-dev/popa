
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Для Вероники ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #12000b, #3b001f, #75002f);
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .heart {
      position: relative;
      width: 220px;
      height: 220px;
      background: #ff1744;
      transform: rotate(-45deg) scale(0);
      animation:
        openHeart 2s ease forwards,
        heartbeat 1.2s ease-in-out 2s infinite;
      box-shadow:
        0 0 30px #ff1744,
        0 0 70px #ff1744,
        0 0 130px rgba(255, 23, 68, 0.8);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      background: #ff1744;
      border-radius: 50%;
    }

    .heart::before {
      top: -110px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 110px;
    }

    h1 {
      position: relative;
      margin-top: 130px;
      padding: 0 20px;
      color: white;
      font-size: clamp(32px, 7vw, 75px);
      opacity: 0;
      transform: translateY(40px);
      animation: showText 1.5s ease 1.5s forwards;
      text-shadow:
        0 0 10px #ff5c8a,
        0 0 30px #ff1744;
    }

    @keyframes openHeart {
      0% {
        transform: rotate(-45deg) scale(0);
        opacity: 0;
      }

      70% {
        transform: rotate(-45deg) scale(1.15);
        opacity: 1;
      }

      100% {
        transform: rotate(-45deg) scale(1);
        opacity: 1;
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: rotate(-45deg) scale(1);
      }

      25% {
        transform: rotate(-45deg) scale(1.08);
      }

      40% {
        transform: rotate(-45deg) scale(1);
      }

      60% {
        transform: rotate(-45deg) scale(1.12);
      }
    }

    @keyframes showText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .heart,
      .heart::before,
      .heart::after {
        width: 150px;
        height: 150px;
      }

      .heart::before {
        top: -75px;
      }

      .heart::after {
        left: 75px;
      }

      h1 {
        margin-top: 95px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="heart"></div>
    <h1>Вероника, я тебя люблю ❤️</h1>
  </div>
</body>
</html>
